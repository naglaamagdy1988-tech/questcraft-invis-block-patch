
      - name: build
        run: |
          ./gradlew build
          echo "===== JAR FILES ====="
          find build/libs -maxdepth 1 -type f -name "*.jar" -print
          echo "===== CLASS FILES IN JAR ====="
          for f in build/libs/*.jar; do
            echo "--- $f ---"
            jar tf "$f" | grep -E "QuestCraftRenderPatchClient|ExampleModClient" || true
          done
